[theme]
base = "light"
primaryColor = "#087F79"
backgroundColor = "#F7FAFC"
secondaryBackgroundColor = "#E9F2F3"
textColor = "#19334A"
font = "sans serif"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false

# Hide Streamlit's built-in top-right menu (Rerun, Settings, Print,
# Record a screencast and developer options) for DermaLens users.
[client]
toolbarMode = "minimal"

[ui]
hideTopBar = true
