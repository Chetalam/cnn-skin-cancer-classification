name: Source and account checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r app/requirements.txt scikit-learn==1.6.1
      - run: python -m compileall -q app scripts tests
      - run: python -m unittest discover -s tests -v
